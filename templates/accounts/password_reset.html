{% extends 'base.html' %}

{% block title %}Reset Password - CPS Legacy Chronicle{% endblock %}

{% block content %}
<section class="py-16 md:py-24">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4" style="background: rgba(212,175,55,0.15);">
                <i class="fas fa-envelope-open-text text-2xl" style="color: var(--gold);"></i>
            </div>
            <h1 class="font-display text-3xl font-bold" style="color: var(--navy);">Forgot Password?</h1>
            <p class="text-gray-500 mt-2">Enter your email to receive a reset link</p>
        </div>

        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    {{ form.email }}
                </div>
                <button type="submit" class="btn-primary w-full py-3 rounded-lg text-white font-semibold flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'login' %}" class="text-sm font-medium" style="color: var(--gold);">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
