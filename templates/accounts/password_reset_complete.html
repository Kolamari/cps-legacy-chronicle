{% extends 'base.html' %}

{% block title %}Password Reset Complete - CPS Legacy Chronicle{% endblock %}

{% block content %}
<section class="py-16 md:py-24">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4" style="background: rgba(34,197,94,0.1);">
            <i class="fas fa-check-circle text-2xl text-green-500"></i>
        </div>
        <h1 class="font-display text-3xl font-bold mb-4" style="color: var(--navy);">Password Reset Complete</h1>
        <p class="text-gray-500 mb-6">Your password has been successfully reset. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="btn-primary inline-flex items-center gap-2 px-6 py-3 rounded-lg text-white font-semibold">
            <i class="fas fa-sign-in-alt"></i> Log In
        </a>
    </div>
</section>
{% endblock %}
