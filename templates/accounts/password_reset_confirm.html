{% extends 'base.html' %}

{% block title %}Set New Password - CPS Legacy Chronicle{% endblock %}

{% block content %}
<section class="py-16 md:py-24">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4" style="background: linear-gradient(135deg, var(--navy), #1a3a6a);">
                <i class="fas fa-lock text-2xl text-white"></i>
            </div>
            <h1 class="font-display text-3xl font-bold" style="color: var(--navy);">Set New Password</h1>
            <p class="text-gray-500 mt-2">Create a new password for your account</p>
        </div>

        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    {{ form.new_password1 }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                    {{ form.new_password2 }}
                </div>
                <button type="submit" class="btn-primary w-full py-3 rounded-lg text-white font-semibold flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Set Password
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
